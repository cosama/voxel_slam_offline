# Same canonical profile as nglamp_velodyne.yaml, but feeds every point through
# Voxel-SLAM. This is useful for high-density internal-deskew map inspection and
# can change trajectory behavior relative to the default point_filter_num=3 run.

General:
  bagname: canonical_full_points
  lidar_type: velodyne
  blind: 2.8
  point_filter_num: 1
  is_save_map: false

Odometry:
  cov_gyr: 0.01
  cov_acc: 1.0
  rdw_gyr: 0.0001
  rdw_acc: 0.0001
  down_size: 0.25
  beam_err: 0.01
  dept_err: 0.01
  voxel_size: 2.0
  min_eigen_value: 0.01
  degrade_bound: 100
  point_notime: false

LocalBA:
  win_size: 10
  max_layer: 2
  cov_gyr: 0.01
  cov_acc: 1.0
  rdw_gyr: 0.0001
  rdw_acc: 0.0001
  min_ba_point: 1
  plane_eigen_value_thre: [4.0, 4.0, 4.0, 4.0]
  imu_coef: 0.0001
  thread_num: 5

Loop:
  jud_default: 0.45
  icp_eigval: 15.0
  ratio_drift: 0.01
  curr_halt: 10
  prev_halt: 10
  acsize: 2
  mgsize: 2
  isHighFly: 0

GBA:
  voxel_size: 2.0
  min_eigen_value: 0.01
  eigen_value_array: [9.0, 9.0, 9.0, 9.0]
  total_max_iter: 3

Runtime:
  collect_map: false
  emit_deskewed_points: true
  max_pending_deskewed_scans: 16
  enable_loop_closure: true
  enable_global_mapping: true
