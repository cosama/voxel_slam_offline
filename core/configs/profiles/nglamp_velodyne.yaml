# Algorithm profile for the canonical nglamp Velodyne benchmark: upstream
# parameters only.  Frame calibration is intentionally not stored here, and
# neither is execution policy. Parse URDF/TF outside voxelslam and pass the
# numeric extrinsic to VoxelSlam(..., lidar_to_imu=...); pass the deskewed-scan
# tap and the optional threads as VoxelSlam(..., emit_deskewed_points=...,
# enable_loop_closure=..., enable_global_mapping=...).

General:
  blind: 2.8
  point_filter_num: 3

Odometry:
  cov_gyr: 0.01
  cov_acc: 1.0
  rdw_gyr: 0.0001
  rdw_acc: 0.0001
  down_size: 0.25
  beam_err: 0.01
  dept_err: 0.01
  voxel_size: 2.0
  min_eigen_value: 0.01
  degrade_bound: 100
  point_notime: false

LocalBA:
  win_size: 10
  max_layer: 2
  cov_gyr: 0.01
  cov_acc: 1.0
  rdw_gyr: 0.0001
  rdw_acc: 0.0001
  min_ba_point: 1
  plane_eigen_value_thre: [4.0, 4.0, 4.0, 4.0]
  imu_coef: 0.0001
  thread_num: 5

Loop:
  jud_default: 0.45
  icp_eigval: 15.0
  ratio_drift: 0.01
  curr_halt: 10
  prev_halt: 10
  acsize: 2
  mgsize: 2
  isHighFly: 0

GBA:
  voxel_size: 2.0
  min_eigen_value: 0.01
  eigen_value_array: [9.0, 9.0, 9.0, 9.0]
  total_max_iter: 3
